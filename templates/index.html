<!DOCTYPE html>
<html>
<head>
    <title>SPU销售预测系统</title>
</head>
<body>
    <h1>SPU销售预测系统</h1>
    <p>系统已启动，请通过API访问预测数据。</p>
    <p>API端点：</p>
    <ul>
        <li>/api/start - 开始预测</li>
        <li>/api/stop - 停止预测</li>
        <li>/api/status - 获取预测状态</li>
        <li>/api/predictions/{prediction_id} - 获取预测数据</li>
    </ul>
</body>
</html>
