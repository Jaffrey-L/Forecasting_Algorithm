<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPU预测分析仪表板 V2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #6f42c1, #4a1d96);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background-color: #6f42c1;
            color: white;
            font-weight: bold;
        }
        .mode-card {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .mode-card.active {
            border-color: #6f42c1;
            background-color: #f8f0ff;
        }
        .mode-card h4 {
            margin-top: 10px;
            color: #6f42c1;
        }
        .mode-card p {
            font-size: 14px;
            color: #6c757d;
        }
        .btn-primary {
            background-color: #6f42c1;
            border-color: #6f42c1;
        }
        .btn-primary:hover {
            background-color: #5a339a;
            border-color: #5a339a;
        }
        .progress {
            height: 25px;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #6f42c1, #9775fa);
            transition: width 0.3s ease;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-idle { background-color: #95a5a6; }
        .status-running { background-color: #f39c12; }
        .status-completed { background-color: #27ae60; }
        .status-failed { background-color: #e74c3c; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .metric-card {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #6f42c1;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #6f42c1;
        }
        .metric-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .log-container {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .log-entry {
            margin-bottom: 5px;
        }
        .log-info { color: #e0e0e0; }
        .log-error { color: #ff6b6b; }
        .log-success { color: #51cf66; }
        .log-warning { color: #ffd43b; }
        .spu-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .spu-item {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
        }
        .spu-item:hover {
            background-color: #f8f9fa;
        }
        .spu-item.active {
            background-color: #f8f0ff;
            border-left: 4px solid #6f42c1;
        }
        .wmape-value {
            font-weight: bold;
            color: #6f42c1;
        }
        .model-selector {
            margin-top: 10px;
        }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SPU预测分析仪表板 V2</h1>
            <p>实时日志监控 | 进度追踪 | 模型评估可视化</p>
        </div>
        
        <div class="row">
            <!-- 左侧：模式选择和进度 -->
            <div class="col-md-6">
                <!-- 1. 选择运行模式 -->
                <div class="card">
                    <div class="card-header">
                        1. 选择运行模式
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mode-card active" data-mode="fast">
                                    <div style="font-size: 36px; color: #6f42c1;">⚡</div>
                                    <h4>Fast</h4>
                                    <p>几乎仅使用快速模型，适合快速验证</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mode-card" data-mode="smart">
                                    <div style="font-size: 36px; color: #6f42c1;">🤖</div>
                                    <h4>Smart</h4>
                                    <p>控制模型数量，平衡速度与精度</p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mode-card" data-mode="full">
                                    <div style="font-size: 36px; color: #6f42c1;">📊</div>
                                    <h4>Full</h4>
                                    <p>全套模型与组合策略，追求最高精度</p>
                                </div>
                            </div>
                        </div>
                        <button id="startBtn" class="btn btn-primary btn-lg w-100 mt-4">
                            开始预测分析
                        </button>
                        <button id="stopBtn" class="btn btn-danger btn-lg w-100 mt-4" style="display: none;">
                            停止分析
                        </button>
                    </div>
                </div>
                
                <!-- 2. 整体进度 -->
                <div class="card mt-4">
                    <div class="card-header">
                        2. 整体进度
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <span id="statusIndicator" class="status-indicator status-idle"></span>
                            <span id="statusText">空闲</span>
                        </div>
                        <div class="progress mb-4">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                0%
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="metric-card">
                                <div class="metric-value" id="completedCount">0</div>
                                <div class="metric-label">已完成</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="totalCount">0</div>
                                <div class="metric-label">总SPU</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="successCount">0</div>
                                <div class="metric-label">成功</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧：日志和SPU详情 -->
            <div class="col-md-6">
                <!-- 3. Python运行日志 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        3. Python运行日志
                        <button id="clearLogsBtn" class="btn btn-sm btn-light">
                            清空
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="logContainer" class="log-container">
                            <div class="log-entry log-info">等待启动分析...</div>
                        </div>
                    </div>
                </div>
                
                <!-- 4. 已完成SPU详情 -->
                <div class="card mt-4">
                    <div class="card-header">
                        4. 已完成SPU详情
                    </div>
                    <div class="card-body">
                        <div id="completedSpuList" class="spu-list">
                            <p class="text-muted text-center">暂无完成记录</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 5. 模型选择和误差可视化 -->
        <div class="card mt-4" id="modelVisualizationCard" style="display: none;">
            <div class="card-header">
                5. 模型选择和误差可视化
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h5>SPU: <span id="selectedSpu"></span></h5>
                        <div class="model-selector">
                            <label for="modelSelect" class="form-label">选择模型:</label>
                            <select id="modelSelect" class="form-select">
                                <!-- 模型选项将动态添加 -->
                            </select>
                        </div>
                        <div class="mt-3">
                            <h6>WMAPE值: <span id="wmapeValue" class="wmape-value"></span></h6>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div id="errorChart" class="chart-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        let selectedMode = 'fast';
        let statusCheckInterval = null;
        let logCheckInterval = null;
        let completedSpuData = [];
        let errorChart = null;
        
        // 初始化模式选择
        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', function() {
                document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                selectedMode = this.dataset.mode;
            });
        });
        
        // 开始分析
        async function startAnalysis() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            startBtn.disabled = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';
            
            // 清空之前的数据
            completedSpuData = [];
            document.getElementById('completedSpuList').innerHTML = '<p class="text-muted text-center">等待第一个SPU完成...</p>';
            document.getElementById('modelVisualizationCard').style.display = 'none';
            clearLogs();
            
            try {
                const response = await fetch(`${API_BASE}/api/start-analysis`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: selectedMode })
                });
                
                if (!response.ok) {
                    throw new Error(`启动失败: ${response.status}`);
                }
                
                addLog('success', `分析已启动，运行模式: ${selectedMode.toUpperCase()}`);
                
                // 开始轮询状态和日志
                startStatusCheck();
                startLogCheck();
                
            } catch (error) {
                addLog('error', `启动失败: ${error.message}`);
                startBtn.disabled = false;
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
            }
        }
        
        // 停止分析
        async function stopAnalysis() {
            try {
                await fetch(`${API_BASE}/api/stop-analysis`, { method: 'POST' });
                addLog('warning', '用户手动停止分析');
                stopStatusCheck();
                stopLogCheck();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('stopBtn').style.display = 'none';
            } catch (error) {
                console.error('停止失败:', error);
            }
        }
        
        // 开始状态检查
        function startStatusCheck() {
            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/analysis-status`);
                    const status = await response.json();
                    
                    // 更新状态
                    updateStatus(status);
                    
                    // 如果分析完成或失败，停止检查
                    if (status.status === 'completed' || status.status === 'failed') {
                        stopStatusCheck();
                        stopLogCheck();
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').style.display = 'block';
                        document.getElementById('stopBtn').style.display = 'none';
                    }
                } catch (error) {
                    console.error('获取状态失败:', error);
                }
            }, 1000);
        }
        
        // 停止状态检查
        function stopStatusCheck() {
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
                statusCheckInterval = null;
            }
        }
        
        // 开始日志检查
        function startLogCheck() {
            logCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/analysis-logs`);
                    const data = await response.json();
                    
                    // 只显示新日志
                    const logs = data.logs || [];
                    const container = document.getElementById('logContainer');
                    
                    // 清空现有日志并重新渲染所有日志
                    if (logs.length > 0) {
                        container.innerHTML = '';
                        logs.forEach(log => {
                            // 解析日志格式: [HH:MM:SS] message
                            const match = log.match(/^\[(\d{2}:\d{2}:\d{2})\]\s*(.*)$/);
                            if (match) {
                                const timestamp = match[1];
                                const message = match[2];
                                // 根据消息内容判断类型
                                let type = 'info';
                                if (message.includes('错误') || message.includes('失败') || message.includes('Error')) {
                                    type = 'error';
                                } else if (message.includes('完成') || message.includes('成功') || message.includes('Success')) {
                                    type = 'success';
                                } else if (message.includes('警告') || message.includes('Warning')) {
                                    type = 'warning';
                                }
                                addLog(type, message, timestamp);
                            } else {
                                // 无法解析的日志直接显示
                                addLog('info', log);
                            }
                        });
                    }
                } catch (error) {
                    console.error('获取日志失败:', error);
                }
            }, 1000);
        }
        
        // 停止日志检查
        function stopLogCheck() {
            if (logCheckInterval) {
                clearInterval(logCheckInterval);
                logCheckInterval = null;
            }
        }
        
        // 更新状态
        function updateStatus(status) {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            const completedCount = document.getElementById('completedCount');
            const totalCount = document.getElementById('totalCount');
            const successCount = document.getElementById('successCount');
            
            // 更新状态指示器
            statusIndicator.className = 'status-indicator';
            switch (status.status) {
                case 'running':
                    statusIndicator.classList.add('status-running');
                    statusText.textContent = '运行中';
                    break;
                case 'completed':
                    statusIndicator.classList.add('status-completed');
                    statusText.textContent = '完成';
                    break;
                case 'failed':
                    statusIndicator.classList.add('status-failed');
                    statusText.textContent = '失败';
                    break;
                default:
                    statusIndicator.classList.add('status-idle');
                    statusText.textContent = '空闲';
            }
            
            // 更新进度条
            const progress = status.progress || 0;
            progressBar.style.width = `${progress}%`;
            progressBar.textContent = `${progress}%`;
            
            // 更新计数
            completedCount.textContent = status.processed_count || 0;
            totalCount.textContent = status.total_count || 0;
            successCount.textContent = status.success_count || 0;
        }
        
        // 添加日志
        function addLog(type, message, timestamp = null) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const time = timestamp || new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }
        
        // 清空日志
        function clearLogs() {
            const container = document.getElementById('logContainer');
            container.innerHTML = '<div class="log-entry log-info">等待启动分析...</div>';
        }
        
        // 初始化误差图表
        function initErrorChart() {
            errorChart = echarts.init(document.getElementById('errorChart'));
            errorChart.setOption({
                title: {
                    text: '模型误差对比',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: []
                },
                yAxis: {
                    type: 'value',
                    name: 'WMAPE (%)'
                },
                series: [{
                    name: 'WMAPE',
                    type: 'bar',
                    data: [],
                    itemStyle: {
                        color: '#6f42c1'
                    }
                }]
            });
        }
        
        // 事件监听
        document.getElementById('startBtn').addEventListener('click', startAnalysis);
        document.getElementById('stopBtn').addEventListener('click', stopAnalysis);
        document.getElementById('clearLogsBtn').addEventListener('click', clearLogs);
        
        // 初始化
        addLog('info', '前端已加载，等待用户操作...');
        initErrorChart();
    </script>
</body>
</html>
