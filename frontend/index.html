<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预测分析系统</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">预测分析系统</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="card-title">分析控制</h2>
            </div>
            <div class="card-body">
                <button id="startAnalysis" class="btn btn-primary btn-lg" onclick="startAnalysis()">开始预测分析</button>
                <div id="statusMessage" class="mt-3 text-muted"></div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="card-title">分析进度</h2>
            </div>
            <div class="card-body">
                <div class="progress mb-3" style="height: 25px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <div id="progressText" class="text-center">准备就绪</div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="card-title">分析结果</h2>
            </div>
            <div class="card-body">
                <div id="resultContainer" class="d-none">
                    <div class="mb-4">
                        <h3>总体统计</h3>
                        <div class="row">
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h4 class="card-title">总SPU数</h4>
                                        <p id="totalSpus" class="card-text h3"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h4 class="card-title">成功预测</h4>
                                        <p id="successfulSpus" class="card-text h3 text-success"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h4 class="card-title">失败预测</h4>
                                        <p id="failedSpus" class="card-text h3 text-danger"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card text-center">
                                    <div class="card-body">
                                        <h4 class="card-title">最佳WMAPE</h4>
                                        <p id="bestWmape" class="card-text h3 text-info"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h3>最佳SPU预测</h3>
                        <div id="bestSpuDetails" class="bg-light p-3 rounded"></div>
                    </div>
                    
                    <div class="mb-4">
                        <h3>预测趋势</h3>
                        <canvas id="forecastChart" height="300"></canvas>
                    </div>
                    
                    <div class="mb-4">
                        <h3>模型性能对比</h3>
                        <canvas id="modelChart" height="300"></canvas>
                    </div>
                </div>
                <div id="noResultMessage" class="text-center py-5">
                    <p class="text-muted">点击上方按钮开始分析</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let analysisInterval = null;
        
        function startAnalysis() {
            // 禁用按钮
            document.getElementById('startAnalysis').disabled = true;
            document.getElementById('startAnalysis').textContent = '分析中...';
            document.getElementById('statusMessage').textContent = '正在启动分析...';
            
            // 重置进度
            updateProgress(0, '正在启动分析...');
            
            // 隐藏结果
            document.getElementById('resultContainer').classList.add('d-none');
            document.getElementById('noResultMessage').classList.remove('d-none');
            
            // 发送启动分析请求
            fetch(`${API_BASE_URL}/start-analysis`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'running') {
                    document.getElementById('statusMessage').textContent = '分析已启动，正在处理...';
                    
                    // 开始轮询状态
                    analysisInterval = setInterval(checkAnalysisStatus, 2000);
                }
            })
            .catch(error => {
                console.error('启动分析失败:', error);
                document.getElementById('statusMessage').textContent = '启动分析失败，请重试';
                document.getElementById('startAnalysis').disabled = false;
                document.getElementById('startAnalysis').textContent = '开始预测分析';
            });
        }
        
        function checkAnalysisStatus() {
            fetch(`${API_BASE_URL}/analysis-status`)
            .then(response => response.json())
            .then(status => {
                updateProgress(status.progress, getStatusMessage(status.status, status.progress));
                
                if (status.status === 'completed') {
                    clearInterval(analysisInterval);
                    document.getElementById('startAnalysis').disabled = false;
                    document.getElementById('startAnalysis').textContent = '开始预测分析';
                    document.getElementById('statusMessage').textContent = '分析完成！';
                    displayResults();
                } else if (status.status === 'failed') {
                    clearInterval(analysisInterval);
                    document.getElementById('startAnalysis').disabled = false;
                    document.getElementById('startAnalysis').textContent = '开始预测分析';
                    document.getElementById('statusMessage').textContent = `分析失败: ${status.error}`;
                }
            })
            .catch(error => {
                console.error('获取状态失败:', error);
            });
        }
        
        function updateProgress(progress, message) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            progressBar.style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', progress);
            progressText.textContent = message;
        }
        
        function getStatusMessage(status, progress) {
            switch (status) {
                case 'running':
                    if (progress < 20) return '正在准备数据...';
                    if (progress < 30) return '正在加载数据...';
                    if (progress < 90) return '正在分析SPU...';
                    if (progress < 100) return '正在整理结果...';
                    break;
                case 'completed':
                    return '分析完成！';
                case 'failed':
                    return '分析失败';
                default:
                    return '准备就绪';
            }
        }
        
        function displayResults() {
            fetch(`${API_BASE_URL}/analysis-result`)
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    // 显示结果容器
                    document.getElementById('resultContainer').classList.remove('d-none');
                    document.getElementById('noResultMessage').classList.add('d-none');
                    
                    // 填充统计数据
                    document.getElementById('totalSpus').textContent = result.total_spus;
                    document.getElementById('successfulSpus').textContent = result.successful_spus;
                    document.getElementById('failedSpus').textContent = result.failed_spus;
                    document.getElementById('bestWmape').textContent = `${(result.best_spu.winner_wmape * 100).toFixed(2)}%`;
                    
                    // 填充最佳SPU详情
                    const bestSpuDetails = document.getElementById('bestSpuDetails');
                    bestSpuDetails.innerHTML = `
                        <p><strong>SPU:</strong> ${result.best_spu.spu}</p>
                        <p><strong>最佳模型:</strong> ${result.best_spu.winner_algo}</p>
                        <p><strong>WMAPE:</strong> ${(result.best_spu.winner_wmape * 100).toFixed(2)}%</p>
                        <p><strong>数据长度:</strong> ${result.best_spu.data_length} 周</p>
                        <p><strong>平均销量:</strong> ${result.best_spu.avg_sales.toFixed(2)}</p>
                        <p><strong>趋势:</strong> ${result.best_spu.trend}</p>
                        <p><strong>季节性:</strong> ${result.best_spu.seasonality ? '存在' : '无'}</p>
                    `;
                    
                    // 绘制预测趋势图
                    drawForecastChart(result.best_spu);
                    
                    // 绘制模型性能对比图
                    drawModelChart(result.all_reports);
                } else {
                    document.getElementById('statusMessage').textContent = result.message;
                }
            })
            .catch(error => {
                console.error('获取结果失败:', error);
                document.getElementById('statusMessage').textContent = '获取结果失败，请重试';
            });
        }
        
        function drawForecastChart(bestSpu) {
            const ctx = document.getElementById('forecastChart').getContext('2d');
            
            // 生成未来16周的日期标签
            const labels = [];
            const today = new Date();
            for (let i = 1; i <= 16; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i * 7);
                labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
            }
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '预测销量',
                        data: bestSpu.forecast_values,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: `SPU ${bestSpu.spu} 未来16周预测`
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '销量'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日期'
                            }
                        }
                    }
                }
            });
        }
        
        function drawModelChart(allReports) {
            const ctx = document.getElementById('modelChart').getContext('2d');
            
            // 统计每个模型的使用次数
            const modelCount = {};
            allReports.forEach(report => {
                const model = report.winner_algo;
                modelCount[model] = (modelCount[model] || 0) + 1;
            });
            
            const labels = Object.keys(modelCount);
            const data = Object.values(modelCount);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '模型使用次数',
                        data: data,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)',
                            'rgba(153, 102, 255, 0.6)',
                            'rgba(255, 159, 64, 0.6)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '模型性能对比'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '使用次数'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '模型'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
