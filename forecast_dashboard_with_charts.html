<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPU预测分析仪表板（含图表）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        .progress {
            height: 25px;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            transition: width 0.3s ease;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-idle { background-color: #95a5a6; }
        .status-running { background-color: #f39c12; }
        .status-completed { background-color: #27ae60; }
        .status-failed { background-color: #e74c3c; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .metric-card {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }
        .metric-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .spu-info {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .chart-container {
            height: 500px;
            width: 100%;
            margin-bottom: 20px;
        }
        .spu-selector {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SPU预测分析仪表板（含图表）</h1>
            <p>实时监控预测分析进度，查看预测效果和图表分析</p>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        1. 预测参数配置
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="forecastWeeks" class="form-label">预测周数</label>
                            <input type="number" class="form-control" id="forecastWeeks" value="4" min="1" max="52">
                        </div>
                        <div class="mb-3">
                            <label for="modelSelection" class="form-label">模型选择</label>
                            <select class="form-select" id="modelSelection" multiple>
                                <option value="Prophet" selected>Prophet</option>
                                <option value="Ensemble_Seas" selected>Ensemble_Seas</option>
                                <option value="Ensemble_Wgt" selected>Ensemble_Wgt</option>
                                <option value="Ensemble_Trend" selected>Ensemble_Trend</option>
                            </select>
                            <small class="form-text text-muted">按住Ctrl键可多选</small>
                        </div>
                        <div class="mb-3">
                            <label for="skuAccuracyThreshold" class="form-label">SKU过滤阈值</label>
                            <input type="number" class="form-control" id="skuAccuracyThreshold" value="0.01" min="0" max="1" step="0.001">
                            <small class="form-text text-muted">SKU在SPU中的最小占比</small>
                        </div>
                        <div class="mb-3">
                            <label for="useExternalFeatures" class="form-label">使用外部特征</label>
                            <select class="form-select" id="useExternalFeatures">
                                <option value="false">不使用</option>
                                <option value="true">使用</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="trainingWeeks" class="form-label">训练周数</label>
                            <input type="number" class="form-control" id="trainingWeeks" value="52" min="12" max="104">
                            <small class="form-text text-muted">用于模型训练的历史周数</small>
                        </div>
                        <button id="startAnalysisBtn" class="btn btn-primary btn-lg w-100" onclick="startAnalysis()">
                            开始预测分析
                        </button>
                        <div id="startMessage" class="mt-3"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        2. 分析状态
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <span id="statusIndicator" class="status-indicator status-idle"></span>
                            <span id="statusText">空闲</span>
                        </div>
                        <div class="progress mb-3">
                            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                0%
                            </div>
                        </div>
                        <div id="spuInfo" class="spu-info" style="display: none;">
                            <p><strong>当前处理:</strong> <span id="currentSpu">-</span></p>
                            <p><strong>进度:</strong> <span id="processedCount">0</span>/<span id="totalCount">0</span> SPU</p>
                        </div>
                        <div id="errorMessage" class="error-message" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card" id="resultsCard" style="display: none;">
            <div class="card-header">
                3. 分析结果
            </div>
            <div class="card-body">
                <div class="metrics">
                    <div class="metric-card">
                        <div class="metric-value" id="totalSpus">0</div>
                        <div class="metric-label">总SPU数</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="averageWmape">0%</div>
                        <div class="metric-label">平均WMAPE</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="topPerforming">-</div>
                        <div class="metric-label">表现最好的SPU</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="bottomPerforming">-</div>
                        <div class="metric-label">表现最差的SPU</div>
                    </div>
                </div>
                <div id="successMessage" class="success-message mt-3"></div>
                
                <div class="spu-selector">
                    <label for="spuSelect"><strong>选择SPU查看图表：</strong></label>
                    <select id="spuSelect" class="form-select" onchange="loadChartForSPU()">
                        <option value="">请选择SPU</option>
                    </select>
                </div>
                
                <div id="chartSection" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            4. 综合预测图表
                        </div>
                        <div class="card-body">
                            <div id="forecastChart" class="chart-container"></div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            5. 模型WMAPE对比图
                        </div>
                        <div class="card-body">
                            <div id="wmapeChart" class="chart-container"></div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            6. 季节因子图表
                        </div>
                        <div class="card-body">
                            <div id="seasonalChart" class="chart-container"></div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            7. SKU详细信息
                        </div>
                        <div class="card-body">
                            <div id="skuInfoTable"></div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            8. 历史数据查询
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="historySpu" class="form-label">选择SPU</label>
                                <select class="form-select" id="historySpu">
                                    <option value="">请选择SPU</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="historyDateRange" class="form-label">日期范围</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <input type="date" class="form-control" id="startDate">
                                    </div>
                                    <div class="col-md-6">
                                        <input type="date" class="form-control" id="endDate">
                                    </div>
                                </div>
                            </div>
                            <button class="btn btn-secondary mb-3" onclick="queryHistoryData()">
                                查询历史数据
                            </button>
                            <div id="historyResults" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // API基础URL
        const API_BASE = 'http://localhost:8000';
        let statusCheckInterval = null;
        let forecastChart = null;
        let wmapeChart = null;
        let seasonalChart = null;
        
        // 启动分析
        async function startAnalysis() {
            const startBtn = document.getElementById('startAnalysisBtn');
            const startMessage = document.getElementById('startMessage');
            
            startBtn.disabled = true;
            startMessage.innerHTML = '<div class="alert alert-info">正在启动分析...</div>';
            
            // 获取用户配置的参数
            const params = {
                forecast_weeks: parseInt(document.getElementById('forecastWeeks').value),
                model_selection: Array.from(document.getElementById('modelSelection').selectedOptions).map(option => option.value),
                sku_accuracy_threshold: parseFloat(document.getElementById('skuAccuracyThreshold').value),
                use_external_features: document.getElementById('useExternalFeatures').value === 'true',
                training_weeks: parseInt(document.getElementById('trainingWeeks').value)
            };
            
            try {
                const response = await fetch(`${API_BASE}/api/start-analysis`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                });
                
                if (!response.ok) {
                    throw new Error(`启动分析失败: ${response.status}`);
                }
                
                const result = await response.json();
                startMessage.innerHTML = '<div class="alert alert-success">分析已成功启动！</div>';
                
                // 开始检查状态
                startStatusCheck();
            } catch (error) {
                startMessage.innerHTML = `<div class="alert alert-danger">启动失败: ${error.message}</div>`;
                startBtn.disabled = false;
            }
        }
        
        // 开始检查状态
        function startStatusCheck() {
            // 清除之前的定时器
            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
            }
            
            // 每2秒检查一次状态
            statusCheckInterval = setInterval(async () => {
                await checkAnalysisStatus();
            }, 2000);
        }
        
        // 检查分析状态
        async function checkAnalysisStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/analysis-status`);
                const status = await response.json();
                
                // 更新状态指示器
                const statusIndicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                const progressBar = document.getElementById('progressBar');
                const spuInfo = document.getElementById('spuInfo');
                const currentSpu = document.getElementById('currentSpu');
                const processedCount = document.getElementById('processedCount');
                const totalCount = document.getElementById('totalCount');
                const errorMessage = document.getElementById('errorMessage');
                
                // 更新状态
                switch (status.status) {
                    case 'idle':
                        statusIndicator.className = 'status-indicator status-idle';
                        statusText.textContent = '空闲';
                        break;
                    case 'running':
                        statusIndicator.className = 'status-indicator status-running';
                        statusText.textContent = '运行中';
                        break;
                    case 'completed':
                        statusIndicator.className = 'status-indicator status-completed';
                        statusText.textContent = '完成';
                        break;
                    case 'failed':
                        statusIndicator.className = 'status-indicator status-failed';
                        statusText.textContent = '失败';
                        break;
                }
                
                // 更新进度条
                const progress = status.progress || 0;
                progressBar.style.width = `${progress}%`;
                progressBar.textContent = `${progress}%`;
                progressBar.setAttribute('aria-valuenow', progress);
                
                // 更新SPU信息
                if (status.spu_name || status.processed_count || status.total_count) {
                    spuInfo.style.display = 'block';
                    currentSpu.textContent = status.spu_name || '-';
                    processedCount.textContent = status.processed_count || 0;
                    totalCount.textContent = status.total_count || 0;
                } else {
                    spuInfo.style.display = 'none';
                }
                
                // 显示错误信息
                if (status.error) {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = status.error;
                } else {
                    errorMessage.style.display = 'none';
                }
                
                // 分析完成
                if (status.status === 'completed') {
                    clearInterval(statusCheckInterval);
                    showResults(status.result);
                }
                
                // 分析失败
                if (status.status === 'failed') {
                    clearInterval(statusCheckInterval);
                    document.getElementById('startAnalysisBtn').disabled = false;
                }
            } catch (error) {
                console.error('检查状态失败:', error);
            }
        }
        
        // 显示分析结果
        function showResults(result) {
            const resultsCard = document.getElementById('resultsCard');
            const totalSpus = document.getElementById('totalSpus');
            const averageWmape = document.getElementById('averageWmape');
            const topPerforming = document.getElementById('topPerforming');
            const bottomPerforming = document.getElementById('bottomPerforming');
            const successMessage = document.getElementById('successMessage');
            const spuSelect = document.getElementById('spuSelect');
            const historySpu = document.getElementById('historySpu');
            
            // 更新结果
            if (result) {
                totalSpus.textContent = result.total_spus || 0;
                averageWmape.textContent = result.average_wmape ? `${(result.average_wmape * 100).toFixed(2)}%` : 'N/A';
                topPerforming.textContent = result.top_performing_spus ? result.top_performing_spus.join(', ') : '-';
                bottomPerforming.textContent = result.bottom_performing_spus ? result.bottom_performing_spus.join(', ') : '-';
                successMessage.textContent = `分析完成！共处理 ${result.total_spus || 0} 个SPU，平均预测误差为 ${result.average_wmape ? `${(result.average_wmape * 100).toFixed(2)}%` : 'N/A'}。`;
                
                // 填充SPU选择器
                if (result.spu_list) {
                    spuSelect.innerHTML = '<option value="">请选择SPU</option>';
                    historySpu.innerHTML = '<option value="">请选择SPU</option>';
                    result.spu_list.forEach(spu => {
                        const option1 = document.createElement('option');
                        option1.value = spu;
                        option1.textContent = spu;
                        spuSelect.appendChild(option1);
                        
                        const option2 = document.createElement('option');
                        option2.value = spu;
                        option2.textContent = spu;
                        historySpu.appendChild(option2);
                    });
                }
            }
            
            resultsCard.style.display = 'block';
            document.getElementById('startAnalysisBtn').disabled = false;
        }
        
        // 加载指定SPU的图表
        async function loadChartForSPU() {
            const spuId = document.getElementById('spuSelect').value;
            if (!spuId) {
                document.getElementById('chartSection').style.display = 'none';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/chart-data/${spuId}`);
                const data = await response.json();
                
                if (data.error) {
                    alert(`获取图表数据失败: ${data.error}`);
                    return;
                }
                
                // 显示图表区域
                document.getElementById('chartSection').style.display = 'block';
                
                // 初始化图表
                initCharts(data);
                
            } catch (error) {
                console.error('加载图表数据失败:', error);
                alert(`加载图表数据失败: ${error.message}`);
            }
        }
        
        // 初始化图表
        function initCharts(data) {
            // 销毁现有图表
            if (forecastChart) {
                forecastChart.dispose();
            }
            if (wmapeChart) {
                wmapeChart.dispose();
            }
            if (seasonalChart) {
                seasonalChart.dispose();
            }
            
            // 初始化预测图表
            forecastChart = echarts.init(document.getElementById('forecastChart'));
            const forecastOption = createForecastChartOption(data);
            forecastChart.setOption(forecastOption);
            
            // 初始化WMAPE对比图
            wmapeChart = echarts.init(document.getElementById('wmapeChart'));
            const wmapeOption = createWmapeChartOption(data);
            wmapeChart.setOption(wmapeOption);
            
            // 初始化季节因子图
            seasonalChart = echarts.init(document.getElementById('seasonalChart'));
            const seasonalOption = createSeasonalChartOption(data);
            seasonalChart.setOption(seasonalOption);
            
            // 显示SKU信息
            displaySkuInfo(data);
        }
        
        // 创建预测图表配置
        function createForecastChartOption(data) {
            return {
                title: {
                    text: `SPU: ${data.spu} - 销售预测对比（含SKU拆分）`,
                    subtext: `胜出模型: ${data.winner_algo} (WMAPE: ${(data.validation_wmape * 100).toFixed(2)}%)`,
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                legend: {
                    data: ['历史数据', '实际值', 'SPU未来预测', 'SKU预测'],
                    top: 10
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: ['历史数据', '验证期', '预测期']
                },
                yAxis: {
                    type: 'value',
                    name: '销量'
                },
                series: [
                    {
                        name: '历史数据',
                        type: 'line',
                        data: [100, 120, 110, 130, 140],
                        smooth: true,
                        itemStyle: {
                            color: '#666666'
                        }
                    },
                    {
                        name: '实际值',
                        type: 'line',
                        data: [null, null, 115, 125, 135],
                        smooth: true,
                        itemStyle: {
                            color: '#000000'
                        },
                        markPoint: {
                            data: [
                                {coord: ['验证期', 115], itemStyle: {color: '#000000'}}
                            ]
                        }
                    },
                    {
                        name: 'SPU未来预测',
                        type: 'line',
                        data: [null, null, null, 145, 155],
                        smooth: true,
                        itemStyle: {
                            color: '#9966FF',
                            width: 3
                        },
                        lineStyle: {
                            width: 3
                        },
                        markPoint: {
                            data: [
                                {coord: ['预测期', 145], itemStyle: {color: '#9966FF'}}
                            ]
                        }
                    },
                    {
                        name: 'SKU预测',
                        type: 'line',
                        data: [null, null, null, 142, 152],
                        smooth: true,
                        itemStyle: {
                            color: '#FF6384'
                        },
                        lineStyle: {
                            type: 'dashed'
                        },
                        markPoint: {
                            data: [
                                {coord: ['预测期', 142], itemStyle: {color: '#FF6384'}}
                            ]
                        }
                    }
                ]
            };
        }
        
        // 创建WMAPE对比图配置
        function createWmapeChartOption(data) {
            const modelNames = ['Prophet', 'Ensemble_Seas', 'Ensemble_Wgt', 'Ensemble_Trend'];
            const wmapeValues = [0.15, 0.12, 0.08, 0.10]; // 示例数据
            const colors = modelNames.map((name, index) => 
                name === data.winner_algo ? '#d62728' : '#1f77b4'
            );
            
            return {
                title: {
                    text: '模型 WMAPE 对比',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: modelNames
                },
                yAxis: {
                    type: 'value',
                    name: 'WMAPE',
                    max: 0.2
                },
                series: [
                    {
                        name: 'WMAPE',
                        type: 'bar',
                        data: wmapeValues,
                        itemStyle: {
                            color: (params) => {
                                return colors[params.dataIndex];
                            }
                        }
                    }
                ]
            };
        }
        
        // 创建季节因子图配置
        function createSeasonalChartOption(data) {
            const weeks = Object.keys(data.seasonal_factors || {}).map(key => key.replace('week_', ''));
            const factors = Object.values(data.seasonal_factors || {});
            
            return {
                title: {
                    text: '52周季节因子',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                xAxis: {
                    type: 'category',
                    data: weeks,
                    name: '周'
                },
                yAxis: {
                    type: 'value',
                    name: '季节因子',
                    min: 0.5,
                    max: 1.5
                },
                series: [
                    {
                        name: '季节因子',
                        type: 'line',
                        data: factors,
                        smooth: true,
                        itemStyle: {
                            color: '#3498db'
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                {offset: 0, color: 'rgba(52, 152, 219, 0.3)'},
                                {offset: 1, color: 'rgba(52, 152, 219, 0.1)'}
                            ])
                        },
                        markLine: {
                            data: [
                                {yAxis: 1.0, lineStyle: {color: '#999', type: 'dashed'}},
                                {yAxis: 1.5, lineStyle: {color: '#999', type: 'dashed'}}
                            ]
                        }
                    }
                ]
            };
        }
        
        // 显示SKU信息
        function displaySkuInfo(data) {
            const skuInfoDiv = document.getElementById('skuInfoTable');
            
            if (!data.sku_accuracy || Object.keys(data.sku_accuracy).length === 0) {
                skuInfoDiv.innerHTML = '<p>暂无SKU详细信息</p>';
                return;
            }
            
            let html = '<table class="table table-striped table-hover"><thead><tr><th>SKU</th><th>WMAPE</th><th>总销量</th><th>权重</th></tr></thead><tbody>';
            
            for (const [sku, info] of Object.entries(data.sku_accuracy)) {
                html += `<tr><td>${sku}</td><td>${(info.wmape * 100).toFixed(2)}%</td><td>${info.total_sales}</td><td>${(info.weight_in_spu * 100).toFixed(2)}%</td></tr>`;
            }
            
            html += '</tbody></table>';
            skuInfoDiv.innerHTML = html;
        }
        
        // 查询历史数据
        async function queryHistoryData() {
            const spuId = document.getElementById('historySpu').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const historyResults = document.getElementById('historyResults');
            
            if (!spuId) {
                alert('请选择SPU');
                return;
            }
            
            historyResults.innerHTML = '<div class="alert alert-info">正在查询历史数据...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/chart-data/${spuId}`);
                const data = await response.json();
                
                if (data.error) {
                    historyResults.innerHTML = `<div class="alert alert-danger">查询失败: ${data.error}</div>`;
                    return;
                }
                
                // 显示历史数据
                let html = `<h5>SPU: ${data.spu} 历史预测数据</h5>`;
                html += `<p><strong>运行日期:</strong> ${data.run_date}</p>`;
                html += `<p><strong>预测目标日期:</strong> ${data.forecast_target_date}</p>`;
                html += `<p><strong>胜出模型:</strong> ${data.winner_algo}</p>`;
                html += `<p><strong>验证WMAPE:</strong> ${(data.validation_wmape * 100).toFixed(2)}%</p>`;
                
                historyResults.innerHTML = html;
                
            } catch (error) {
                console.error('查询历史数据失败:', error);
                historyResults.innerHTML = `<div class="alert alert-danger">查询失败: ${error.message}</div>`;
            }
        }
        
        // 获取SPU列表
        async function loadSpuList() {
            try {
                const response = await fetch(`${API_BASE}/api/spu-list`);
                const data = await response.json();
                
                if (data.error) {
                    console.error('获取SPU列表失败:', data.error);
                    return;
                }
                
                // 填充SPU选择器
                const spuSelect = document.getElementById('spuSelect');
                const historySpu = document.getElementById('historySpu');
                
                if (data.spu_list) {
                    spuSelect.innerHTML = '<option value="">请选择SPU</option>';
                    historySpu.innerHTML = '<option value="">请选择SPU</option>';
                    data.spu_list.forEach(spu => {
                        const option1 = document.createElement('option');
                        option1.value = spu;
                        option1.textContent = spu;
                        spuSelect.appendChild(option1);
                        
                        const option2 = document.createElement('option');
                        option2.value = spu;
                        option2.textContent = spu;
                        historySpu.appendChild(option2);
                    });
                }
            } catch (error) {
                console.error('加载SPU列表失败:', error);
            }
        }
        
        // 页面加载时检查状态
        window.onload = function() {
            checkAnalysisStatus();
            loadSpuList();
        };
    </script>
</body>
</html>
