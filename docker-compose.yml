version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      FLASK_ENV: ${FLASK_ENV:-development}
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-nexusbi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexusbi123}
      POSTGRES_DB: ${DB_NAME:-nexusbi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
